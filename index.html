<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GTA VI · Cuenta regresiva</title>
  <meta name="description" content="Cuenta regresiva para el lanzamiento de GTA VI en Uruguay.">

  <!-- PWA / iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GTA VI">
  <meta name="theme-color" content="#1a0b3b">
  <meta name="format-detection" content="telephone=no">

  <link rel="preload" as="image" href="img/fondo.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="hero"></div>
  </div>

  <main class="content" id="app">
    <h1 class="logo-wrap">
      <img class="logo" src="img/logo.png" width="450" height="340" alt="Grand Theft Auto VI">
    </h1>
    <p class="kicker">Cuenta regresiva · Uruguay</p>

    <section class="grid" id="countdown" aria-label="Tiempo restante" role="timer" aria-live="off">
      <div class="cell">
        <span class="num" id="days">--</span>
        <span class="lbl">Días</span>
      </div>
      <div class="cell">
        <span class="num" id="hours">--</span>
        <span class="lbl">Horas</span>
      </div>
      <div class="cell">
        <span class="num" id="minutes">--</span>
        <span class="lbl">Min</span>
      </div>
      <div class="cell">
        <span class="num" id="seconds">--</span>
        <span class="lbl">Seg</span>
      </div>
    </section>

    <p class="release" id="release">¡Ya salió!</p>

    <p class="date" id="dateLabel">Jueves 19 de noviembre de 2026</p>
    <p class="tz" id="tzLabel">00:00 · hora de Uruguay</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
